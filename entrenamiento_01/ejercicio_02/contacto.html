<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto — Ejercicio 02</title>
    <link rel="stylesheet" href="contacto.css">
</head>

<body>

    <header class="header">
        <a href="ejercicio_02.html">HOME</a>
        <span class="separador">|</span>
        <a href="contacto.html" class="activo">CONTACTO</a>
    </header>

    <main class="contenido">
        <div class="formulario">
            <form action="#" method="post">

                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo">
                    <label for="tel">Tel:</label>
                    <input type="tel" id="tel" name="tel" required>
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" required></textarea>
                </div>

                <div class="botones">
                    <button type="submit" class="boton">Enviar</button>
                    <a href="ejercicio_02.html" class="boton">Cancelar</a>
                </div>

            </form>
        </div>
    </main>

    <footer class="footer">
        <p>Todos los derechos reservados &copy; 2025 Isaac Rios</p>
    </footer>

</body>

</html>
